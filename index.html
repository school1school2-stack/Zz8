<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - نموذج (6) - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--maroon); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        .input-group { margin: 15px auto; width: 85%; text-align: right; }
        input, select { width: 100%; padding: 14px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 1.1rem; outline: none; box-sizing: border-box; background: #fff; margin-bottom: 10px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #f4f4f4; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; }
        .q-section-tag { color: var(--maroon); font-weight: bold; font-size: 1rem; margin-bottom: 10px; display: block; text-align: right; border-right: 4px solid var(--gold); padding-right: 10px; }
        .q-text { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 30px; line-height: 1.8; color: #222; min-height: 50px; }
        .reading-box { background: #fff9e6; border: 1.5px solid #f0e68c; padding: 20px; border-radius: 12px; margin-bottom: 20px; line-height: 1.8; font-size: 1.1rem; text-align: justify; color: #333; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 18px; border: 2px solid #ececec; border-radius: 12px; cursor: pointer; transition: 0.2s; text-align: center; font-size: 1.2rem; background: #fff; font-weight: 600; }
        .opt:hover { border-color: var(--gold); background: #fffcf0; }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .btn { background: var(--maroon); color: var(--gold); padding: 14px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
        #timer { color: var(--maroon); font-size: 1.6rem; font-weight: 800; border: 2px solid var(--gold); padding: 5px 15px; border-radius: 50px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="quiz-card">
    <div class="header">
        <h3 style="margin:0; color:var(--maroon);">أ / عبدالعزيز الفيفي ✨</h3>
        <h2 style="margin:5px 0;">محاكي القدرات اللفظي - <span id="model-title">نموذج (6)</span></h2>
        <p style="margin:0; color:var(--gold); font-weight:bold;">ثانوية الأمير عبدالمجيد 🎓</p>
    </div>

    <div id="start-page" style="text-align: center;">
        <div class="input-group"><input type="text" id="studentName" placeholder="الاسم الثلاثي"></div>
        <div class="input-group">
            <select id="stageSelect" onchange="updateClasses()">
                <option value="">-- اختر المرحلة الدراسية --</option>
                <option value="أول ثانوي">أول ثانوي</option>
                <option value="ثاني ثانوي">ثاني ثانوي</option>
                <option value="ثالث ثانوي">ثالث ثانوي</option>
            </select>
            <select id="studentClass" class="hidden"><option value="">-- اختر الفصل --</option></select>
        </div>
        <p id="lock-msg" style="color:red; font-weight:bold;" class="hidden">عذراً، لا يمكن دخول الاختبار أكثر من مرة من هذا الجهاز.</p>
        <button id="start-btn" class="btn" onclick="checkDeviceAndEntry()">دخول الاختبار 🚀</button>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: bold;"></div>
            <div id="timer">45</div>
        </div>
        <span id="question-category" class="q-section-tag"></span>
        <div id="reading-container" class="reading-box hidden"></div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        <div style="text-align: center; margin-top: 25px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 style="color: var(--maroon);">انتهى الاختبار</h2>
        <div style="font-size: 4rem; font-weight: bold; margin: 20px 0; color: var(--gold);" id="score-text"></div>
        <p id="cloud-msg" style="font-size: 1.1rem; color: #555;"></p>
        <button class="btn" onclick="location.reload()">خروج</button>
    </div>
</div>

<script>
    const currentModelId = "model_6";
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // دالة إنشاء بصمة فريدة للجهاز (Fingerprint)
    function getDeviceFingerprint() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const txt = 'Abdulaziz_Al-Faifi_Security_2026';
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillText(txt, 2, 2);
        return btoa(canvas.toDataURL());
    }

    const deviceFingerprint = getDeviceFingerprint();

    function updateClasses() {
        const stage = document.getElementById('stageSelect').value;
        const classSelect = document.getElementById('studentClass');
        classSelect.innerHTML = '<option value="">-- اختر الفصل --</option>';
        if (stage) {
            classSelect.classList.remove('hidden');
            for (let i = 1; i <= 6; i++) {
                const opt = document.createElement('option');
                opt.value = `${stage} - ${i}`;
                opt.innerText = `فصل ${i}`;
                classSelect.appendChild(opt);
            }
        } else { classSelect.classList.add('hidden'); }
    }

    async function checkDeviceAndEntry() {
        const nameInput = document.getElementById('studentName').value.trim();
        const classInput = document.getElementById('studentClass').value;
        
        if(nameInput.split(' ').length < 3) return alert("يرجى كتابة الاسم الثلاثي.");
        if(!classInput) return alert("يرجى اختيار الفصل.");

        const btn = document.getElementById('start-btn');
        btn.disabled = true;

        try {
            // البحث عن البصمة في قاعدة البيانات لهذا النموذج تحديداً
            const fingerprintSnapshot = await db.collection("student_results")
                .where("device_id", "==", deviceFingerprint)
                .where("model_id", "==", currentModelId)
                .get();

            if (!fingerprintSnapshot.empty) {
                alert("تم رصد محاولة دخول من هذا الجهاز مسبقاً لهذا النموذج.");
                document.getElementById('lock-msg').classList.remove('hidden');
                return;
            }

            startQuiz(nameInput, classInput);
        } catch (e) { startQuiz(nameInput, classInput); }
    }

    const quizData = [
        // --- قسم التناظر اللفظي ---
        { cat: "التناظر اللفظي", q: "أسد : زئير", opts: ["حمام : هديل", "نحل : عسل", "صقر : وكر", "خيل : إسطبل"], ans: "حمام : هديل" },
        { cat: "التناظر اللفظي", q: "أشجار : غابة", opts: ["كتب : مكتبة", "سيارة : وقود", "ماء : بئر", "جندي : سلاح"], ans: "كتب : مكتبة" },
        { cat: "التناظر اللفظي", q: "صقر : مخلب", opts: ["جمل : خف", "قط : مواء", "غزال : سرعة", "إنسان : عقل"], ans: "جمل : خف" },
        { cat: "التناظر اللفظي", q: "خيط : ثوب", opts: ["لبنة : جدار", "غصن : غابة", "ورقة : كتاب", "حلقة : سلسلة"], ans: "لبنة : جدار" },
        { cat: "التناظر اللفظي", q: "شتاء : ربيع", opts: ["السبت : الأحد", "فجر : ظهر", "نوم : يقظة", "حر : برد"], ans: "السبت : الأحد" },
        { cat: "التناظر اللفظي", q: "سكين : قطع", opts: ["قلم : كتابة", "فأس : حطب", "إبرة : خياط", "مطرقة : حديد"], ans: "قلم : كتابة" },
        { cat: "التناظر اللفظي", q: "مستشفى : طبيب", opts: ["مدرسة : معلم", "مطار : مسافر", "ملعب : كرة", "مزرعة : فواكه"], ans: "مدرسة : معلم" },
        { cat: "التناظر اللفظي", q: "بحر : سمك", opts: ["غابة : أشجار", "سماء : نجوم", "منزل : أثاث", "صحراء : رمال"], ans: "غابة : أشجار" },
        { cat: "التناظر اللفظي", q: "ماء : حياة", opts: ["علم : نور", "نار : دخان", "سفر : تعب", "أكل : شبع"], ans: "علم : نور" },
        { cat: "التناظر اللفظي", q: "قريب : بعيد", opts: ["طويل : قصير", "سريع : بطيء", "جميل : قبيح", "غني : فقير"], ans: "طويل : قصير" },

        // --- قسم إكمال الجمل ---
        { cat: "إكمال الجمل", q: "من يقدم على العمل وهو ...... ، فسوف ينجزه وهو ...... .", opts: ["واثق - مبدع", "متردد - خائف", "نشيط - متعب", "مستعجل - نادم"], ans: "واثق - مبدع" },
        { cat: "إكمال الجمل", q: "الاعتذار لا يعني أنك على ...... ، بل يعني أنك تقدر ...... .", opts: ["خطأ - العلاقة", "حق - الشخص", "عجلة - الموقف", "علم - الحقيقة"], ans: "خطأ - العلاقة" },
        { cat: "إكمال الجمل", q: "القناعة كنز لا ...... ، وهي سر ...... الدائم.", opts: ["ينفد - السعادة", "يضيع - الغنى", "ينتهي - النجاح", "يصدأ - الأمل"], ans: "ينفد - السعادة" },
        { cat: "إكمال الجمل", q: "أفضل وسيلة للتعامل مع ...... هي ...... .", opts: ["الجهلاء - التجاهل", "الأعداء - المواجهة", "الوقت - الضياع", "العمل - التكاسل"], ans: "الجهلاء - التجاهل" },
        { cat: "إكمال الجمل", q: "العقل السليم في الجسم ...... .", opts: ["السليم", "الرياضي", "القوي", "الجميل"], ans: "السليم" },
        { cat: "إكمال الجمل", q: "من طلب ...... بغير ...... ضيع العمر في طلب المحال.", opts: ["العلم - جد", "المال - سرقة", "الفوز - قوة", "الراحة - تعب"], ans: "العلم - جد" },
        { cat: "إكمال الجمل", q: "اللغة العربية لغة ...... لأنها لغة ...... .", opts: ["خالدة - القرآن", "عريقة - العرب", "سهلة - التعليم", "واسعة - العالم"], ans: "خالدة - القرآن" },
        { cat: "إكمال الجمل", q: "حسن ...... يستر الكثير من ...... .", opts: ["الخلق - العيوب", "الكلام - الأخطاء", "المظهر - النوايا", "الظن - المشاكل"], ans: "الخلق - العيوب" },
        { cat: "إكمال الجمل", q: "إذا تم العقل ...... الكلام.", opts: ["قلّ", "زاد", "طاب", "حسن"], ans: "قلّ" },
        { cat: "إكمال الجمل", q: "خير الكلام ما ...... ودل.", opts: ["قلّ", "طال", "ظهر", "نفع"], ans: "قلّ" },

        // --- قسم الخطأ السياقي ---
        { cat: "الخطأ السياقي", q: "المجتهد يرى في كل مشكلة فرصة، والكسول يرى في كل فرصة مصيبة.", opts: ["المجتهد", "مشكلة", "الكسول", "مصيبة"], ans: "مصيبة" },
        { cat: "الخطأ السياقي", q: "إذا كنت تريد النجاح، فاحرص على مرافقة الفاشلين.", opts: ["تريد", "النجاح", "احرص", "الفاشلين"], ans: "الفاشلين" },
        { cat: "الخطأ السياقي", q: "كن جواداً مع الفقراء، فالبخل صفة محمودة.", opts: ["جواداً", "الفقراء", "البخل", "محمودة"], ans: "محمودة" },
        { cat: "الخطأ السياقي", q: "الصمت في وقت الحاجة قوة، والكلام في غير موضعه حكمة.", opts: ["الصمت", "قوة", "الكلام", "حكمة"], ans: "حكمة" },
        { cat: "الخطأ السياقي", q: "الكتب هي خزائن العلم، فاحرص على إتلافها.", opts: ["الكتب", "خزائن", "احرص", "إتلافها"], ans: "إتلافها" },
        { cat: "الخطأ السياقي", q: "الأمانة ثقيلة، فلا يحملها إلا من اتصف بالخيانة.", opts: ["الأمانة", "ثقيلة", "يحملها", "الخيانة"], ans: "الخيانة" },
        { cat: "الخطأ السياقي", q: "السعادة تنبع من الداخل، لذا ابحث عنها في الخارج.", opts: ["السعادة", "الداخل", "ابحث", "الخارج"], ans: "الخارج" },
        { cat: "الخطأ السياقي", q: "النجاح يحتاج إلى عمل قليل وصبر طويل.", opts: ["النجاح", "يحتاج", "قليل", "طويل"], ans: "قليل" },
        { cat: "الخطأ السياقي", q: "المؤمن كالنحلة، لا تأكل إلا طيباً ولا تضع إلا رديئاً.", opts: ["المؤمن", "تأكل", "طيباً", "رديئاً"], ans: "رديئاً" },
        { cat: "الخطأ السياقي", q: "نحن نعيش في عصر السرعة حيث يتنقل الناس بالسفن الشراعية.", opts: ["نعيش", "السرعة", "يتنقل", "بالسفن"], ans: "بالسفن" },

        // --- قسم استيعاب المقروء (نصوص أطول) ---
        { 
            cat: "استيعاب المقروء", 
            passage: "تعتبر النخلة في الثقافة العربية رمزاً تاريخياً للعطاء والصمود، فهي شجرة مباركة ارتبطت بحياة الإنسان في الجزيرة العربية منذ آلاف السنين، وتتميز بقدرتها الفائقة على تحمل الظروف المناخية القاسية من جفاف وحرارة، كما أنها توفر الغذاء المتكامل المتمثل في التمر بأنواعه المختلفة.",
            q: "القدرة التي تميز النخلة في النص هي:", opts: ["تحمل الجفاف", "سرعة النمو", "جمال السعف", "كثرة الثمار"], ans: "تحمل الجفاف" 
        },
        { 
            cat: "استيعاب المقروء", 
            passage: "أثبتت الدراسات التربوية أن القراءة الحرة خارج المنهج الدراسي تساهم بشكل كبير في توسيع مدارك الطالب وتنمية لغته وإثرائه بالمعلومات العامة، وهي تساعد أيضاً على تحسين المهارات التحليلية وفهم النصوص المعقدة، مما ينعكس إيجاباً على أدائه في كافة الاختبارات المعيارية والجامعية.",
            q: "وفقاً للنص، القراءة الحرة تؤدي إلى:", opts: ["تحسين الأداء الدراسي", "إهمال المنهج", "صعوبة الاختبارات", "تضييع الوقت"], ans: "تحسين الأداء الدراسي" 
        },
        { 
            cat: "استيعاب المقروء", 
            passage: "المملكة العربية السعودية تشهد نهضة تقنية كبرى في مجال التحول الرقمي، حيث أصبحت الخدمات الحكومية الإلكترونية نموذجاً يحتذى به عالمياً، وتهدف هذه الجهود إلى تسهيل حياة المواطنين والمقيمين وتقليل الهدر الزمني وتوفير الجهد، بما يتوافق مع تطلعات رؤية المملكة 2030.",
            q: "الهدف من التحول الرقمي حسب النص هو:", opts: ["تسهيل حياة الناس", "زيادة التكلفة", "تعقيد الإجراءات", "منع السفر"], ans: "تسهيل حياة الناس" 
        },
        { 
            cat: "استيعاب المقروء", 
            passage: "يعد الحليب مصدراً أساسياً للكالسيوم والبروتينات والفيتامينات الضرورية لبناء العظام والأسنان، وخاصة في مرحلة الطفولة والمراهقة، لذا ينصح الأطباء بضرورة تناول الحليب أو مشتقاته بشكل يومي لضمان صحة الجسم والوقاية من الأمراض المرتبطة بهشاشة العظام في مراحل العمر المتقدمة.",
            q: "ينصح الأطباء بتناول الحليب يومياً للوقاية من:", opts: ["هشاشة العظام", "ضعف النظر", "أمراض الجلد", "تساقط الشعر"], ans: "هشاشة العظام" 
        },
        { 
            cat: "استيعاب المقروء", 
            passage: "تعتبر الطيور المهاجرة من عجائب الطبيعة، حيث تقطع آلاف الكيلومترات في رحلات موسمية بحثاً عن الدفء وتوفر الغذاء، وتعتمد في رحلتها على حواس دقيقة تمكنها من تحديد الاتجاهات بدقة مذهلة، وتعتبر بعض المناطق في المملكة محطات استراحة هامة لهذه الطيور أثناء رحلتها السنوية.",
            q: "تهاجر الطيور بشكل أساسي بحثاً عن:", opts: ["الدفء والغذاء", "الأعداء", "النوم", "الماء المالح"], ans: "الدفء والغذاء" 
        },

        // --- قسم المفردة الشاذة ---
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (أسد - نمر - فهد - غزال)", opts: ["أسد", "نمر", "فهد", "غزال"], ans: "غزال" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (مكتبة - كتاب - مجلة - تلفاز)", opts: ["مكتبة", "كتاب", "مجلة", "تلفاز"], ans: "تلفاز" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (مربع - مستطيل - دائرة - مكعب)", opts: ["مربع", "مستطيل", "دائرة", "مكعب"], ans: "مكعب" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (حديد - ذهب - فحم - نحاس)", opts: ["حديد", "ذهب", "فحم", "نحاس"], ans: "فحم" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (الرياض - جدة - الدمام - لندن)", opts: ["الرياض", "جدة", "الدمام", "لندن"], ans: "لندن" }
    ];

    let currentIdx = 0, userScore = 0, timer, sName, sClass;

    function startQuiz(name, cls) {
        sName = name; sClass = cls;
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if(currentIdx >= quizData.length) return finishQuiz();
        const data = quizData[currentIdx];
        document.getElementById('q-counter').innerText = `سؤال ${currentIdx + 1} من ${quizData.length}`;
        document.getElementById('question-category').innerText = `القسم: ${data.cat}`;
        const rc = document.getElementById('reading-container');
        if(data.passage) { rc.innerText = data.passage; rc.classList.remove('hidden'); }
        else { rc.classList.add('hidden'); }
        document.getElementById('question-text').innerText = data.q;
        document.getElementById('next-btn').classList.add('hidden');
        const box = document.getElementById('options-area'); box.innerHTML = '';
        [...data.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = o;
            d.onclick = () => check(o, d); box.appendChild(d);
        });
        startTimer();
    }

    function check(sel, el) {
        clearInterval(timer); const correctAns = quizData[currentIdx].ans;
        if(sel === correctAns) userScore++;
        document.querySelectorAll('.opt').forEach(opt => {
            opt.onclick = null;
            if(opt.innerText === correctAns) opt.classList.add('correct');
            else if(opt.innerText === sel) opt.classList.add('wrong');
        });
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s <= 0) { clearInterval(timer); check("N/A", null); }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finishQuiz() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-text').innerText = `${userScore} / ${quizData.length}`;
        try {
            await db.collection("student_results").add({
                name: sName, student_class: sClass, score: userScore, total: quizData.length,
                model_id: currentModelId, device_id: deviceFingerprint,
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('cloud-msg').innerText = "✅ تم حفظ النتيجة بنجاح في قاعدة البيانات.";
        } catch(e) { console.error(e); }
    }
</script>
</body>
</html>
