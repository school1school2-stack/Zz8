<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - نموذج (6) - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--maroon); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        .input-group { margin: 15px auto; width: 85%; text-align: right; }
        input, select { width: 100%; padding: 14px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 1.1rem; outline: none; box-sizing: border-box; background: #fff; margin-bottom: 10px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #f4f4f4; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; }
        .q-section-tag { color: var(--maroon); font-weight: bold; font-size: 1rem; margin-bottom: 10px; display: block; text-align: right; border-right: 4px solid var(--gold); padding-right: 10px; }
        .q-text { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 30px; line-height: 1.8; color: #222; min-height: 50px; }
        .reading-box { background: #fff9e6; border: 1.5px solid #f0e68c; padding: 20px; border-radius: 12px; margin-bottom: 20px; line-height: 1.8; font-size: 1.1rem; text-align: justify; color: #333; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 18px; border: 2px solid #ececec; border-radius: 12px; cursor: pointer; transition: 0.2s; text-align: center; font-size: 1.2rem; background: #fff; font-weight: 600; }
        .opt:hover { border-color: var(--gold); background: #fffcf0; }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .btn { background: var(--maroon); color: var(--gold); padding: 14px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
        #timer { color: var(--maroon); font-size: 1.6rem; font-weight: 800; border: 2px solid var(--gold); padding: 5px 15px; border-radius: 50px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="quiz-card">
    <div class="header">
        <h3 style="margin:0; color:var(--maroon);">أ / عبدالعزيز الفيفي ✨</h3>
        <h2 style="margin:5px 0;">محاكي القدرات اللفظي - <span id="model-title">النموذج (6)</span></h2>
        <p style="margin:0; color:var(--gold); font-weight:bold;">ثانوية الأمير عبدالمجيد 🎓</p>
    </div>

    <div id="start-page" style="text-align: center;">
        <div class="input-group"><input type="text" id="studentName" placeholder="الاسم الثلاثي"></div>
        <div class="input-group">
            <select id="stageSelect" onchange="updateClasses()">
                <option value="">-- اختر المرحلة الدراسية --</option>
                <option value="أول ثانوي">أول ثانوي</option>
                <option value="ثاني ثانوي">ثاني ثانوي</option>
                <option value="ثالث ثانوي">ثالث ثانوي</option>
            </select>
            <select id="studentClass" class="hidden"><option value="">-- اختر الفصل --</option></select>
        </div>
        <button id="start-btn" class="btn" onclick="checkDoubleEntry()">دخول الاختبار 🚀</button>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="nav-bar">
            <div id="q-counter" style="font-weight: bold;"></div>
            <div id="timer">45</div>
        </div>
        <span id="question-category" class="q-section-tag"></span>
        <div id="reading-container" class="reading-box hidden"></div>
        <div id="question-text" class="q-text"></div>
        <div id="options-area" class="options-grid"></div>
        <div style="text-align: center; margin-top: 25px;">
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 style="color: var(--maroon);">انتهى الاختبار</h2>
        <div style="font-size: 4rem; font-weight: bold; margin: 20px 0; color: var(--gold);" id="score-text"></div>
        <p id="cloud-msg" style="font-size: 1.1rem; color: #555;"></p>
        <button class="btn" onclick="location.reload()">خروج</button>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // 1. إعدادات وقاعدة البيانات
    // ---------------------------------------------------------
    const currentModelId = "model_6";
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ---------------------------------------------------------
    // 2. مصفوفة الأسئلة (سهلة التعديل)
    // ---------------------------------------------------------
    const quizData = [
        // --- قسم التناظر اللفظي ---
        { cat: "التناظر اللفظي", q: "كتاب : ورقة", opts: ["جدار : لبنة", "فصل : مدرسة", "شمس : ضوء", "غصن : غابة"], ans: "جدار : لبنة" },
        { cat: "التناظر اللفظي", q: "سفينة : مرسى", opts: ["طائرة : مطار", "سيارة : وقود", "قطار : قضبان", "حافلة : ركاب"], ans: "طائرة : مطار" },
        { cat: "التناظر اللفظي", q: "منشار : خشب", opts: ["مقص : قماش", "سكين : مطبخ", "قلم : سبورة", "فأس : مزارع"], ans: "مقص : قماش" },
        { cat: "التناظر اللفظي", q: "رئة : تنفس", opts: ["قلب : ضخ", "عين : نظارة", "يد : حركة", "أذن : سماعة"], ans: "قلب : ضخ" },
        { cat: "التناظر اللفظي", q: "غزال : رشاقة", opts: ["ثعلب : مكر", "أسد : غابة", "جمل : صحراء", "صقر : وكر"], ans: "ثعلب : مكر" },
        { cat: "التناظر اللفظي", q: "بترول : بنزين", opts: ["قمح : دقيق", "حديد : منجم", "ذهب : خاتم", "خشب : كرسي"], ans: "قمح : دقيق" },
        { cat: "التناظر اللفظي", q: "ليل : نهار", opts: ["شمال : جنوب", "أبيض : ناصع", "سماء : غيوم", "صيف : حر"], ans: "شمال : جنوب" },
        { cat: "التناظر اللفظي", q: "صلاة : وضوء", opts: ["حج : إحرام", "سفر : حقيبة", "نجاح : مذاكرة", "نوم : حلم"], ans: "حج : إحرام" },
        { cat: "التناظر اللفظي", q: "معلم : مدرسة", opts: ["فلاح : مزرعة", "مهندس : خريطة", "طبيب : سماعة", "جندي : سلاح"], ans: "فلاح : مزرعة" },
        { cat: "التناظر اللفظي", q: "شتاء : ربيع", opts: ["طفولة : شباب", "فجر : صباح", "السبت : الأحد", "مارس : أبريل"], ans: "السبت : الأحد" },

        // --- قسم إكمال الجمل ---
        { cat: "إكمال الجمل", q: "لا تجادل ...... ، فقد يخطئ الناس في ...... بينكما.", opts: ["الجاهل - التفريق", "العالم - المقارنة", "الصديق - الحكم", "الكبير - الفصل"], ans: "الجاهل - التفريق" },
        { cat: "إكمال الجمل", q: "من زاد ...... زاد قدره، ومن كثر ...... سقطت هيبته.", opts: ["علمه - مزاحه", "ماله - بخله", "صدقه - كذبه", "صبره - خوفه"], ans: "علمه - مزاحه" },
        { cat: "إكمال الجمل", q: "الاعتذار لا يعني أنك على ...... ، بل يعني أنك تقدر ...... .", opts: ["خطأ - العلاقة", "صواب - الوقت", "عجلة - الآخر", "علم - الصداقة"], ans: "خطأ - العلاقة" },
        { cat: "إكمال الجمل", q: "إن طول ...... في العلم يورث ...... في الفهم.", opts: ["النظر - الدقة", "الانتظار - الملل", "البحث - الحيرة", "السكوت - التعب"], ans: "النظر - الدقة" },
        { cat: "إكمال الجمل", q: "يعد ...... من أهم وسائل ...... المعرفة بين الشعوب.", opts: ["الكتاب - نقل", "المال - نشر", "السفر - ضياع", "اللعب - تبادل"], ans: "الكتاب - نقل" },
        { cat: "إكمال الجمل", q: "صديقك من ...... لا من ...... .", opts: ["صدقك - صدّقك", "أعطاك - منعك", "بكاك - ضحكك", "عرفك - جهلك"], ans: "صدقك - صدّقك" },
        { cat: "إكمال الجمل", q: "العمل ...... خير من الفراغ ...... .", opts: ["المجهد - المفسد", "القليل - الكثير", "الصعب - السهل", "الدائم - المتقطع"], ans: "المجهد - المفسد" },
        { cat: "إكمال الجمل", q: "حسن ...... يستر الكثير من ...... .", opts: ["الخلق - العيوب", "الكلام - الحقائق", "المنظر - الأخطاء", "الظن - المشاكل"], ans: "الخلق - العيوب" },
        { cat: "إكمال الجمل", q: "المتوكل هو من ...... بجهده ثم ...... على الله.", opts: ["بدأ - اعتمد", "انتهى - نام", "قعد - توكل", "فشل - شكى"], ans: "بدأ - اعتمد" },
        { cat: "إكمال الجمل", q: "الماء إذا ...... فسد، وإذا ...... صفا.", opts: ["ركد - جرى", "سخن - برد", "كثر - قلّ", "نقص - زاد"], ans: "ركد - جرى" },

        // --- قسم الخطأ السياقي ---
        { cat: "الخطأ السياقي", q: "من أراد علو البنيان، فعليه بتجهيز السقف قبل الأساس.", opts: ["علو", "البنيان", "السقف", "الأساس"], ans: "السقف" },
        { cat: "الخطأ السياقي", q: "المتفائل يرى ضوءاً في الظلام، والمتشائم يحرص على إطفائه.", opts: ["المتفائل", "ضوءاً", "المتشائم", "إطفائه"], ans: "إطفائه" },
        { cat: "الخطأ السياقي", q: "إذا لم تستطع القيام بعمل خير، فلا تفعل عملاً حسناً.", opts: ["تستطع", "خير", "تفعل", "حسناً"], ans: "حسناً" },
        { cat: "الخطأ السياقي", q: "الكلام كالدواء، إن قللت منه نفع، وإن أكثرت منه شفى.", opts: ["كالدواء", "نفع", "أكثرت", "شفى"], ans: "شفى" },
        { cat: "الخطأ السياقي", q: "المرء يعرف بفعله، ويقاس طوله بلسانه.", opts: ["يعرف", "بفعله", "طوله", "بلسانه"], ans: "طوله" },
        { cat: "الخطأ السياقي", q: "العظمة في الحياة لا تكمن في النجاح، بل في الفوز عند السقوط.", opts: ["العظمة", "النجاح", "الفوز", "السقوط"], ans: "الفوز" },
        { cat: "الخطأ السياقي", q: "قوة الحق لا تظهر إلا في مواجهة الباطل الضعيف.", opts: ["قوة", "الحق", "مواجهة", "الضعيف"], ans: "الضعيف" },
        { cat: "الخطأ السياقي", q: "التاجر الأمين هو من يسعى للربح بإنقاص جودة البضاعة.", opts: ["الأمين", "يسعى", "الربح", "إنقاص"], ans: "إنقاص" },
        { cat: "الخطأ السياقي", q: "العلم يرفع بيوتاً لا عماد لها، والجهل يبني بيوت العز والكرم.", opts: ["يرفع", "عماد", "الجهل", "يبني"], ans: "يبني" },
        { cat: "الخطأ السياقي", q: "المعلم الناجح هو من يبسط المعلومة المعقدة ليزيدها صعوبة.", opts: ["المعلم", "يبسط", "المعلومة", "صعوبة"], ans: "صعوبة" },

        // --- قسم استيعاب المقروء ---
        { cat: "استيعاب المقروء", passage: "المها العربي حيوان مهدد بالانقراض، يعيش في الصحاري القاسية، ويتميز بلونه الأبيض الذي يعكس أشعة الشمس.", q: "يعتبر اللون الأبيض للمها العربي وسيلة لـ:", opts: ["الاختفاء", "مقاومة الحرارة", "جذب الفرائس", "الزينة"], ans: "مقاومة الحرارة" },
        { cat: "استيعاب المقروء", passage: "التجارة الإلكترونية أصبحت عصب الاقتصاد الحديث، حيث توفر الوقت والجهد وتتيح التسوق من أي مكان.", q: "أهم ميزة للتجارة الإلكترونية حسب النص:", opts: ["التكلفة العالية", "توفير الوقت", "صعوبة التواصل", "قلة البضائع"], ans: "توفير الوقت" },
        { cat: "استيعاب المقروء", passage: "العسل الطبيعي لا يفسد أبداً إذا تم حفظه في أوعية محكمة الإغلاق بعيداً عن الرطوبة.", q: "الشرط الأساسي لبقاء العسل صالحاً هو:", opts: ["الحفظ المحكم", "تجميده", "تعريضه للشمس", "وضعه في الثلاجة"], ans: "الحفظ المحكم" },
        { cat: "استيعاب المقروء", passage: "الرياض يمثل المركز المالي والسياسي للمملكة، ويشهد تطوراً عمرانياً هائلاً في السنوات الأخيرة.", q: "الصفة التي أطلقها النص على مدينة الرياض:", opts: ["مدينة ساحلية", "مركز مالي وسياسي", "مدينة زراعية", "مدينة صغيرة"], ans: "مركز مالي وسياسي" },
        { cat: "استيعاب المقروء", passage: "تعد القهوة العربية رمزاً للضيافة والكرم، وتقدم دائماً مع التمر في المجالس والمناسبات.", q: "ترتبط القهوة العربية في الثقافة بـ:", opts: ["الضيافة", "الرياضة", "السفر", "النوم"], ans: "الضيافة" },

        // --- قسم المفردة الشاذة ---
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (خاتم - سوار - قلادة - ساعة)", opts: ["خاتم", "سوار", "قلادة", "ساعة"], ans: "ساعة" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (تفاح - موز - بطيخ - فجل)", opts: ["تفاح", "موز", "بطيخ", "فجل"], ans: "فجل" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (طائرة - سيارة - قطار - غواصة)", opts: ["طائرة", "سيارة", "قطار", "غواصة"], ans: "غواصة" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (ذهب - فضة - نحاس - فحم)", opts: ["ذهب", "فضة", "نحاس", "فحم"], ans: "فحم" },
        { cat: "المفردة الشاذة", q: "حدد المفردة الشاذة: (القاهرة - الرياض - مكة - الكويت)", opts: ["القاهرة", "الرياض", "مكة", "الكويت"], ans: "مكة" }
    ];

    // ---------------------------------------------------------
    // 3. المحرك البرمجي (دون تغيير)
    // ---------------------------------------------------------
    let currentIdx = 0, userScore = 0, timer, sName, sClass;

    function updateClasses() {
        const stage = document.getElementById('stageSelect').value;
        const classSelect = document.getElementById('studentClass');
        classSelect.innerHTML = '<option value="">-- اختر الفصل --</option>';
        if (stage) {
            classSelect.classList.remove('hidden');
            for (let i = 1; i <= 6; i++) {
                const opt = document.createElement('option');
                opt.value = `${stage} - ${i}`;
                opt.innerText = `فصل ${i}`;
                classSelect.appendChild(opt);
            }
        } else { classSelect.classList.add('hidden'); }
    }

    async function checkDoubleEntry() {
        const nameInput = document.getElementById('studentName').value.trim();
        const classInput = document.getElementById('studentClass').value;
        if(nameInput.split(' ').length < 3) return alert("يرجى كتابة الاسم الثلاثي.");
        if(!classInput) return alert("يرجى اختيار الفصل.");
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        try {
            const snapshot = await db.collection("student_results").where("name", "==", nameInput).where("model_id", "==", currentModelId).get();
            if (!snapshot.empty || localStorage.getItem('taken_' + currentModelId)) {
                alert("تم رصد محاولة سابقة بهذا الاسم لهذا النموذج.");
                location.reload();
            } else { startQuiz(nameInput, classInput); }
        } catch (e) { startQuiz(nameInput, classInput); }
    }

    function startQuiz(name, cls) {
        sName = name; sClass = cls;
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if(currentIdx >= quizData.length) return finishQuiz();
        const data = quizData[currentIdx];
        document.getElementById('q-counter').innerText = `سؤال ${currentIdx + 1} من ${quizData.length}`;
        document.getElementById('question-category').innerText = `القسم: ${data.cat}`;
        const rc = document.getElementById('reading-container');
        if(data.passage) { rc.innerText = data.passage; rc.classList.remove('hidden'); }
        else { rc.classList.add('hidden'); }
        document.getElementById('question-text').innerText = data.q;
        document.getElementById('next-btn').classList.add('hidden');
        const box = document.getElementById('options-area'); box.innerHTML = '';
        [...data.opts].sort(() => Math.random() - 0.5).forEach(o => {
            const d = document.createElement('div'); d.className = 'opt'; d.innerText = o;
            d.onclick = () => check(o, d); box.appendChild(d);
        });
        startTimer();
    }

    function check(sel, el) {
        clearInterval(timer); const correctAns = quizData[currentIdx].ans;
        if(sel === correctAns) userScore++;
        document.querySelectorAll('.opt').forEach(opt => {
            opt.onclick = null;
            if(opt.innerText === correctAns) opt.classList.add('correct');
            else if(opt.innerText === sel) opt.classList.add('wrong');
        });
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--; document.getElementById('timer').innerText = s;
            if(s <= 0) { clearInterval(timer); check("N/A", null); }
        }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finishQuiz() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-text').innerText = `${userScore} / ${quizData.length}`;
        localStorage.setItem('taken_' + currentModelId, 'true');
        try {
            await db.collection("student_results").add({
                name: sName, student_class: sClass, score: userScore, total: quizData.length, model_id: currentModelId,
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('cloud-msg').innerText = "✅ أحسنت يا " + sName + "، تم إرسال نتيجتك لقاعدة البيانات.";
        } catch(e) { console.error(e); }
    }
</script>
</body>
</html>
